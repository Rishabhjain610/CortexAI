services:
  redis:
    image: redis:alpine
    container_name: cortexai-redis
    ports:
      - "6379:6379"

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: cortexai-gateway
    ports:
      - "8000:8000"
    env_file:
      - ./gateway/.env
    environment:
      - PORT=8000
      - AUTH_SERVICE_URL=http://auth:8001
      - CHAT_SERVICE_URL=http://chat:8002
      - AGENT_SERVICE_URL=http://agent:8003
      - BILLING_SERVICE_URL=http://billing:8004
      - REDIS_URL=redis://redis:6379
      - BENCH_MODE=1
    depends_on:
      - redis
      - auth
      - chat
      - agent
      - billing

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    container_name: cortexai-auth
    env_file:
      - ./services/auth/.env
    environment:
      - PORT=8001
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  chat:
    build:
      context: .
      dockerfile: services/chat/Dockerfile
    container_name: cortexai-chat
    env_file:
      - ./services/chat/.env
    environment:
      - PORT=8002
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    container_name: cortexai-agent
    env_file:
      - ./services/agent/.env
    environment:
      - PORT=8003
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://auth:8001
      - CHAT_SERVICE=http://chat:8002
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - QDRANT_END_POINT=http://host.docker.internal:6333
      - QDRANT_API_KEY=
      - GEMINI_MODEL=gemini-3.1-flash-lite
      - BENCH_MODE=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis

  billing:
    build:
      context: .
      dockerfile: services/billing/Dockerfile
    container_name: cortexai-billing
    env_file:
      - ./services/billing/.env
    environment:
      - PORT=8004
      - REDIS_URL=redis://redis:6379
      - AUTH_SERVICE_URL=http://auth:8001
      - BENCH_MODE=1
    depends_on:
      - redis
